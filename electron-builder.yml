appId: ai.designcanvas.desktop
productName: DesignCanvas
directories:
  output: release
asar: true
files:
  - desktop/**
  - package.json
extraResources:
  - from: .next/standalone
    to: renderer
  - from: .next/standalone/node_modules
    to: renderer/node_modules
  - from: .next/static
    to: renderer/.next/static
  - from: public
    to: renderer/public
  - from: src/lib/db/schema.sql
    to: schema/schema.sql
  - from: src/lib/db/schema-v1.9.sql
    to: schema/schema-v1.9.sql
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  executableName: DesignCanvas
  target:
    - nsis
  artifactName: DesignCanvas-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
